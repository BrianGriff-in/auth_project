{% extends 'base.html' %}

{% block title %}Edit {{ u.username }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="fw-bold mb-4">Edit User</h4>

          {% if messages %}
            {% for msg in messages %}
              <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
            {% endfor %}
          {% endif %}

          <form method="post">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" name="username" class="form-control" value="{{ u.username }}" required/>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" value="{{ u.email }}" required/>
            </div>

            <div class="mb-3">
              <label class="form-label">New Password <small class="text-muted">(leave blank to keep current)</small></label>
              <input type="password" name="password" class="form-control" placeholder="••••••••"/>
            </div>

            <div class="mb-3 d-flex gap-4">
              <div class="form-check">
                <input type="checkbox" name="is_staff" class="form-check-input" id="isStaff" {% if u.is_staff %}checked{% endif %}/>
                <label class="form-check-label" for="isStaff">Staff</label>
              </div>
              <div class="form-check">
                <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {% if u.is_active %}checked{% endif %}/>
                <label class="form-check-label" for="isActive">Active</label>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Save Changes</button>
              <a href="{% url 'user_detail' u.pk %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
