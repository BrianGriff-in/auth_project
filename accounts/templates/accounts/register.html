{% extends 'base.html' %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card card shadow-lg">

    <div class="card-body p-4 p-md-5">
      <h2 class="text-center fw-bold mb-1">Create account</h2>
      <p class="text-center text-muted mb-4">Sign up for free</p>

      <div id="registerError" class="alert alert-danger d-none"></div>
      <div id="registerSuccess" class="alert alert-success d-none"></div>
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="regUsername" class="form-control" placeholder="johndoe"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="regEmail" class="form-control" placeholder="you@example.com"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="regPassword" class="form-control" placeholder="••••••••"/>
      </div>

      <button id="registerBtn" class="btn btn-success w-100 mb-3" onclick="handleRegister()">
        <span id="registerSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
        Create Account
      </button>

      <div class="divider my-3"><span>or continue with</span></div>

      <a href="/accounts/google/login/" class="btn btn-outline-danger w-100 mb-2 social-btn">
          <i class="bi bi-google me-2"></i>
        Continue with Google
      </a>
      <a href="/accounts/facebook/login/" class="btn btn-outline-primary w-100 social-btn">
        <i class="bi bi-facebook me-2"></i>
        Continue with Facebook
      </a>

      <p class="text-center mt-4 mb-0">
        Already have an account? <a href="{% url 'login' %}">Sign in</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
