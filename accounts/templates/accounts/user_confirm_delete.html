{% extends 'base.html' %}

{% block title %}Delete {{ u.username }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-danger">
        <div class="card-body p-4 text-center">

          <div class="avatar-placeholder mx-auto mb-3">{{ u.username|first|upper }}</div>
          <h4 class="fw-bold">Delete {{ u.username }}?</h4>
          <p class="text-muted">This action cannot be undone. All data for this user will be permanently deleted.</p>

          <form method="post" class="d-flex gap-2 justify-content-center mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'user_detail' u.pk %}" class="btn btn-outline-secondary">Cancel</a>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
