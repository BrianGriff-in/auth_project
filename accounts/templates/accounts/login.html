{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card card shadow-lg">

    <div class="card-body p-4 p-md-5">
      <h2 class="text-center fw-bold mb-1">Welcome back</h2>
      <p class="text-center text-muted mb-4">Sign in to your account</p>

      <!-- Error alert -->
      <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

      <!-- Login Form -->
      <div id="loginForm">
          {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••"/>
        </div>

        <button id="loginBtn" class="btn btn-primary w-100 mb-3" onclick="handleLogin()">
          <span id="loginSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
          Sign In
        </button>
      </div>

      <div class="divider my-3"><span>or continue with</span></div>

      <!-- Social Buttons -->
      <a href="/accounts/google/login/" class="btn btn-outline-danger w-100 mb-2 social-btn">
        <i class="bi bi-google me-2"></i>
        Continue with Google
      </a>
      <a href="/accounts/facebook/login/" class="btn btn-outline-primary w-100 social-btn">
        <i class="bi bi-facebook me-2"></i>
        Continue with Facebook
      </a>

      <p class="text-center mt-4 mb-0">
        Don't have an account? <a href="{% url 'register' %}">Register</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
